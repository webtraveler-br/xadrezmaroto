services:
  xadrezmaroto-back:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        USER_ID: ${UID:-1000}
        GROUP_ID: ${GID:-1000}
    container_name: xadrezmaroto_back
    restart: unless-stopped
    tty: true
    environment:
      SERVICE_NAME: xadrezmaroto-back
      SERVICE_TAGS: dev
      APP_NAME: ${APP_NAME:-XadrezMaroto}
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_URL: ${APP_URL:-http://localhost:8000}

      LOG_CHANNEL: ${LOG_CHANNEL:-stack}
      LOG_LEVEL: ${LOG_LEVEL:-debug}

      DB_CONNECTION: ${DB_CONNECTION:-mysql}
      DB_HOST: xadrezmaroto-db
      DB_PORT: ${DB_PORT:-3306}
      DB_DATABASE: ${DB_DATABASE:-xadrezmaroto}
      DB_USERNAME: ${DB_USERNAME:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin123}

      XDEBUG_MODE: ${XDEBUG_MODE:-off} # Use 'debug' ou 'develop,debug' para ativar
      XDEBUG_CONFIG: "client_host=host.docker.internal client_port=9003"
      PHP_IDE_CONFIG: "serverName=DockerLaravel"
    working_dir: /var/www/html
    volumes:
      - ./backend:/var/www/html:cached
      # - ./backend/storage:/var/www/html/storage
      # - ./backend/bootstrap/cache:/var/www/html/bootstrap/cache
    ports:
      - "${LARAVEL_APP_PORT:-8000}:8000"
      # - "9003:9003"
    networks:
      - xadrezmaroto-network
    depends_on:
      - xadrezmaroto-db

  xadrezmaroto-front:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: xadrezmaroto_front
    restart: unless-stopped
    tty: true
    ports:
      - "${REACT_APP_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app:cached
      - ./frontend/node_modules:/app/node_modules:cached
    environment:
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: "true"
      WDS_SOCKET_PORT: "0"
      NEXT_PUBLIC_API_URL: "http://localhost:${LARAVEL_APP_PORT:-8000}/api"
    networks:
      - xadrezmaroto-network
    depends_on:
      - xadrezmaroto-back

  xadrezmaroto-db:
    image: mysql:8.0
    container_name: xadrezmaroto_db
    restart: unless-stopped
    tty: true
    ports:
      - "${DB_EXPOSED_PORT:-33066}:3306"
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-xadrezmaroto}
      MYSQL_USER: ${DB_USERNAME:-admin}
      MYSQL_PASSWORD: ${DB_PASSWORD:-admin123}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-admin123}
    volumes:
      - xadrezmaroto_db_persist:/var/lib/mysql
    networks:
      - xadrezmaroto-network

networks:
  xadrezmaroto-network:
    driver: bridge

volumes:
  xadrezmaroto_db_persist: